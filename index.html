<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slap Club</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }

  #unity-canvas {
    position: absolute;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease-in;
  }

  #loading-cover {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    background: radial-gradient(circle at center, rgba(30,80,180,0.25) 0%, rgba(10,20,50,0.15) 30%, rgba(0,0,0,0) 70%), #000;
  }

  .loader {
    position: relative;
    width: 460px;
    height: 460px;
    transform-origin: center center;
    z-index: 2;
  }

  /* Основной центральный glow */
  #center-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(80, 200, 255, 0.68) 0%, rgba(80, 200, 255, 0.14) 48%, transparent 78%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    filter: blur(28px);
    will-change: transform, opacity;
  }

  /* Второй маленький динамический glow */
  #secondary-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(120, 225, 255, 0.75) 0%, rgba(100, 210, 255, 0.18) 42%, transparent 72%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
    filter: blur(22px);
    will-change: transform, opacity;
  }

  .logo {
    position: absolute;
    width: 180px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    filter: blur(28px);
    z-index: 3;
    will-change: transform;
  }

  /* Иконки вместо квадратов */
  .particle {
    position: absolute;
    width: 80px;               /* чуть больше, чем было у квадратов */
    height: 80px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    filter: brightness(1.15) drop-shadow(0 0 14px #4fc3ff) blur(28px);   /* свечение + цвет */
    z-index: 0;
  }
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading-cover">
  <div class="loader" id="loader">
    <div id="center-glow"></div>
    <div id="secondary-glow"></div>
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const TARGET_ASPECT = 1920 / 1080;
const DESIGN_SIZE = 460;

let unityReady = false;
let phase = "out";
let t = 0;
let floatStrength = 0.45;
let glowPulse = 0;
let secondaryOffsetX = 0;
let secondaryOffsetY = 0;

const OUT_DURATION = 1.2;
const MIN_HOVER_TIME_AFTER_READY = 1.15;
const IN_DURATION = 1.45;
const BOUNCE_DURATION = 0.68;

const LERP_K = 18;

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const loader = document.getElementById("loader");
const logo = document.getElementById("logo");
const centerGlow = document.getElementById("center-glow");
const secondaryGlow = document.getElementById("secondary-glow");

// ===== RESIZE =====
function resizeCanvas() {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;

  const scaleX = (screenW * 0.92) / DESIGN_SIZE;
  const scaleY = (screenH * 0.92) / DESIGN_SIZE;
  const loaderScale = Math.min(scaleX, scaleY, 1.05);   // чуть позволяем расти на больших экранах

  loader.style.transform = `scale(${loaderScale.toFixed(4)})`;

  let cssW, cssH;
  if (screenW / screenH > TARGET_ASPECT) {
    cssH = screenH;
    cssW = Math.floor(screenH * TARGET_ASPECT);
  } else {
    cssW = screenW;
    cssH = Math.floor(screenW / TARGET_ASPECT);
  }

  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  const renderW = Math.floor(cssW * dpr);
  const renderH = Math.floor(cssH * dpr);

  canvas.width = renderW;
  canvas.height = renderH;

  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== PARTICLES → ИКОНКИ 1.png ... 9.png =====
const COUNT = 9;
const MIN_R = 115, MAX_R = 205;   // немного увеличил радиус для красивого разлёта
let particles = [];
let currentPositions = [];

for (let i = 1; i <= COUNT; i++) {
  const el = document.createElement("img");
  el.className = "particle";
  el.src = `${i}.png`;                    // 1.png, 2.png ... 9.png
  el.alt = `icon ${i}`;
  document.getElementById("loader").appendChild(el);

  particles.push({
    el: el,
    tx: 0, 
    ty: 0,
    offset: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 3.0
  });
  currentPositions.push({ x: 0, y: 0, rot: 0 });
}

function initParticles() {
  for (let p of particles) {
    const angle = Math.random() * Math.PI * 2;
    const radius = MIN_R + Math.random() * (MAX_R - MIN_R);
    p.tx = Math.cos(angle) * radius;
    p.ty = Math.sin(angle) * radius;
  }
}

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

// ===== MAIN LOOP =====
let last = performance.now();

function loop(now) {
  const dt = (now - last) * 0.001;
  last = now;
  t += dt;
  const globalTime = now * 0.0019;

  glowPulse = (Math.sin(globalTime * 1.8) + 1) * 0.5;

  secondaryOffsetX = Math.sin(globalTime * 0.85) * 38 + Math.cos(globalTime * 1.35) * 22;
  secondaryOffsetY = Math.cos(globalTime * 0.95) * 34 + Math.sin(globalTime * 1.1) * 19;

  if (phase === "out" && t > OUT_DURATION) { phase = "hover"; t = 0; }
  if (phase === "hover" && unityReady && t >= MIN_HOVER_TIME_AFTER_READY) {
    phase = "in";
    t = 0;
  }
  if (phase === "in" && t > IN_DURATION) { phase = "bounce"; t = 0; }
  if (phase === "bounce" && t > BOUNCE_DURATION) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 780);
  }

  const targetFloat = (phase === "hover" || phase === "out") ? 1.28 : 0.4;
  floatStrength += (targetFloat - floatStrength) * 11 * dt;

  // Анимация иконок
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let baseX = 0, baseY = 0, alpha = 1;

    if (phase === "out") {
      const progress = easeOutCubic(Math.min(t / OUT_DURATION, 1));
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = progress;
    } else if (phase === "hover") {
      baseX = p.tx;
      baseY = p.ty;
      alpha = 1;
    } else if (phase === "in") {
      const pVal = Math.min(t / IN_DURATION, 1);
      const progress = 1 - easeOutCubic(pVal);
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = Math.max(0, (1 - pVal) * 2.4);
    } else {
      alpha = 0;
    }

    const lerpFactor = 1 - Math.exp(-LERP_K * dt);
    currentPositions[i].x += (baseX - currentPositions[i].x) * lerpFactor;
    currentPositions[i].y += (baseY - currentPositions[i].y) * lerpFactor;

    const fx = Math.sin(globalTime * 1.7 + p.offset) * 7;
    const fy = Math.cos(globalTime * 1.55 + p.offset * 1.4) * 6.8;

    const x = currentPositions[i].x + fx * floatStrength;
    const y = currentPositions[i].y + fy * floatStrength;

    currentPositions[i].rot += p.rotSpeed * dt * 38;
    const rot = currentPositions[i].rot;

    p.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rot.toFixed(1)}deg)`;
    p.el.style.opacity = alpha.toFixed(3);
  }

  // Glows
  const glowScale = 0.96 + glowPulse * 0.08;
  const glowOpacity = 0.68 + glowPulse * 0.22;
  centerGlow.style.transform = `translate(-50%, -50%) scale(${glowScale.toFixed(3)})`;
  centerGlow.style.opacity = glowOpacity.toFixed(3);

  const secScale = 0.92 + glowPulse * 0.12;
  secondaryGlow.style.transform = `translate(-50%, -50%) translate(${secondaryOffsetX.toFixed(1)}px, ${secondaryOffsetY.toFixed(1)}px) scale(${secScale.toFixed(3)})`;

  // Logo bounce
  if (phase === "bounce") {
    let scale = 1;
    if (t < 0.22) scale = 1 + (t / 0.22) * 0.38;
    else if (t < 0.48) scale = 1.38 - ((t - 0.22) / 0.26) * 0.43;
    else scale = 0.95 + ((t - 0.48) / 0.14) * 0.06;
    logo.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY LOADING =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = `${buildUrl}/SC.loader.js`;

const config = {
  dataUrl: `${buildUrl}/SC.data.unityweb`,
  frameworkUrl: `${buildUrl}/SC.framework.js.unityweb`,
  codeUrl: `${buildUrl}/SC.wasm.unityweb`
};

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
    .then(() => {
      unityReady = true;
      console.log("%cUnity ready", "color:#4fc3ff");
    })
    .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
initParticles();
resizeCanvas();
requestAnimationFrame(loop);

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150));
</script>
</body>
</html>
