<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slap Club</title>

<style>
body { margin:0; background:#000; overflow:hidden; }

#unity-canvas {
  position:absolute;
  background:#000;
}

#loading-cover {
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.loader {
  position:relative;
  width:400px;
  height:400px;
}

.square {
  position:absolute;
  width:70px;
  height:70px;
  background:#4CAF50;
  border-radius:10px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.circle {
  position:absolute;
  width:20px;
  height:20px;
  background:#FF5722;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}
</style>
</head>

<body>

<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <div class="square" id="square"></div>
  </div>
</div>

<script>
// ===== RESIZE =====
const GAME_ASPECT = 1920/1080;
function resizeCanvas() {
  const c = document.getElementById("unity-canvas");
  const w = window.innerWidth;
  const h = window.innerHeight;

  let dw, dh;
  if (w/h > GAME_ASPECT) {
    dh = h; dw = h * GAME_ASPECT;
  } else {
    dw = w; dh = w / GAME_ASPECT;
  }

  c.style.width = dw+"px";
  c.style.height = dh+"px";
  c.style.left = "50%";
  c.style.top = "50%";
  c.style.transform = "translate(-50%,-50%)";
}

// ===== LOADER STATE =====
let unityReady = false;
let animationDone = false;

// ===== ELEMENTS =====
const loader = document.getElementById("loader");
const square = document.getElementById("square");

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 80;
const MAX_R = 140;

let circles = [];

for (let i=0;i<COUNT;i++){
  let el = document.createElement("div");
  el.className = "circle";
  loader.appendChild(el);

  circles.push({
    el,
    x:0,y:0,
    offset:Math.random()*1000
  });
}

function regen(){
  circles.forEach(c=>{
    let a = Math.random()*Math.PI*2;
    let r = MIN_R + Math.random()*(MAX_R-MIN_R);
    c.x = Math.cos(a)*r;
    c.y = Math.sin(a)*r;
  });
}

// easing
const easeOut = t => 1-Math.pow(1-t,3);
const easeIn = t => t*t*t;

// ===== LOOP =====
let time = 0;
let mode = "fly"; // fly → hover → return → done

function animate(){
  time += 0.016;

  // --- переключение состояний ---
  if (mode === "fly" && time > 1){
    mode = "hover";
  }

  if (mode === "hover" && unityReady){
    mode = "return";
    time = 0;
  }

  if (mode === "return" && time > 1){
    mode = "done";
    animationDone = true;
    hideLoader();
  }

  circles.forEach(c=>{
    let baseX=0, baseY=0, alpha=1;

    if (mode === "fly"){
      let t = time;
      baseX = c.x * easeOut(t);
      baseY = c.y * easeOut(t);
      alpha = t;
    }

    if (mode === "hover"){
      baseX = c.x;
      baseY = c.y;
      alpha = 1;
    }

    if (mode === "return"){
      let t = time;
      let k = 1 - easeIn(t);
      baseX = c.x * k;
      baseY = c.y * k;

      bounceSquare(t);
    }

    if (mode === "done"){
      alpha = 0;
    }

    // плавное парение
    let floatX = Math.sin(performance.now()*0.002 + c.offset)*5;
    let floatY = Math.cos(performance.now()*0.002 + c.offset)*5;

    let strength = (mode==="hover") ? 1 : 0.5;

    let x = baseX + floatX*strength;
    let y = baseY + floatY*strength;

    c.el.style.transform =
      `translate(-50%,-50%) translate(${x}px,${y}px)`;

    c.el.style.opacity = alpha;
  });

  requestAnimationFrame(animate);
}

// ===== BOUNCE =====
function bounceSquare(t){
  let s;
  if (t<0.5) s = 1 + t*0.3;
  else s = 1.15 - (t-0.5)*0.5;

  square.style.transform =
    `translate(-50%,-50%) scale(${s})`;
}

// ===== HIDE =====
function hideLoader(){
  const cover = document.getElementById("loading-cover");

  cover.style.transition = "opacity 0.4s ease";
  cover.style.opacity = 0;

  setTimeout(()=>{
    cover.style.display = "none";
  },400);
}

// ===== UNITY LOAD =====
const buildUrl = "Build";
const loaderUrl = buildUrl + "/SC.loader.js";

const config = {
  dataUrl: buildUrl + "/SC.data.unityweb",
  frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
  codeUrl: buildUrl + "/SC.wasm.unityweb",
};

const canvas = document.getElementById("unity-canvas");

const script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
  createUnityInstance(canvas, config, ()=>{})
    .then(()=>{
      unityReady = true; // 🔥 ключ
    })
    .catch(alert);
};

document.body.appendChild(script);

// старт
regen();
animate();
resizeCanvas();

window.addEventListener("resize", resizeCanvas);
</script>

</body>
</html>
