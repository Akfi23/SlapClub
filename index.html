<!DOCTYPE html>
<html lang="en-us">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Slap Club</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #000;
}

/* ===== UNITY ===== */

#unity-container {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#unity-canvas {
  background: #000;
  position: absolute;
}

/* ===== LOADER ===== */

#loading-cover {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.loader {
  position: relative;
  width: 300px;
  height: 300px;
}

/* квадрат */
.square {
  position: absolute;
  width: 60px;
  height: 60px;
  background: #4CAF50;
  border-radius: 10px;

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);

  animation: squareBounce 4s infinite ease-in-out;
}

/* круги */
.circle {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #FF5722;
  border-radius: 50%;

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) translate(0,0);
  opacity: 0;

  animation: move 4s infinite ease-in-out;
}

/* позиции */
.c1 { --x: 0px;   --y: -110px; }
.c2 { --x: 80px;  --y: -80px; }
.c3 { --x: 110px; --y: 0px; }
.c4 { --x: 80px;  --y: 80px; }
.c5 { --x: 0px;   --y: 110px; }
.c6 { --x: -80px; --y: 80px; }
.c7 { --x: -110px;--y: 0px; }
.c8 { --x: -80px; --y: -80px; }
.c9 { --x: 40px;  --y: 40px; }

/* движение */
@keyframes move {

  0% {
    transform: translate(-50%, -50%) translate(0,0);
    opacity: 0;
  }

  25% {
    transform: translate(-50%, -50%) translate(var(--x), var(--y));
    opacity: 1;
  }

  50% {
    transform: translate(-50%, -50%) translate(var(--x), var(--y)) translate(5px, -5px);
  }

  60% {
    transform: translate(-50%, -50%) translate(var(--x), var(--y)) translate(-5px, 5px);
  }

  85% {
    transform: translate(-50%, -50%) translate(0,0);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -50%) translate(0,0);
    opacity: 0;
  }
}

/* bounce */
@keyframes squareBounce {

  0%, 70%, 100% {
    transform: translate(-50%, -50%) scale(1);
  }

  80% {
    transform: translate(-50%, -50%) scale(1.2);
  }

  90% {
    transform: translate(-50%, -50%) scale(0.9);
  }
}
</style>
</head>

<body>

<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
</div>

<!-- LOADER -->
<div id="loading-cover">
  <div class="loader">
    <div class="square"></div>

    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
    <div class="circle c5"></div>
    <div class="circle c6"></div>
    <div class="circle c7"></div>
    <div class="circle c8"></div>
    <div class="circle c9"></div>
  </div>
</div>

<script>
const GAME_ASPECT = 1920 / 1080;

function resizeCanvas() {
  const canvas = document.getElementById("unity-canvas");

  const w = window.innerWidth;
  const h = window.innerHeight;

  let drawWidth, drawHeight;

  if (w / h > GAME_ASPECT) {
    drawHeight = h;
    drawWidth = h * GAME_ASPECT;
  } else {
    drawWidth = w;
    drawHeight = w / GAME_ASPECT;
  }

  canvas.style.width = drawWidth + "px";
  canvas.style.height = drawHeight + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== UNITY LOAD =====

const buildUrl = "Build";
const loaderUrl = buildUrl + "/SC.loader.js";

const config = {
  dataUrl: buildUrl + "/SC.data.unityweb",
  frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
  codeUrl: buildUrl + "/SC.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "aaaaa",
  productName: "Slap Club",
  productVersion: "1.0",
};

const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");

const script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
    .then(() => {
      // скрываем loader
      loadingCover.style.display = "none";
      resizeCanvas();
    })
    .catch(alert);
};

document.body.appendChild(script);

// resize events
window.addEventListener("resize", resizeCanvas);
window.addEventListener("load", resizeCanvas);
</script>

</body>
</html>
