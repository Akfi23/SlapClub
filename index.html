<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slap Club</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  background: radial-gradient(circle at center, rgba(30,80,180,0.25) 0%, rgba(10,20,50,0.15) 30%, rgba(0,0,0,0) 70%), #000;
  transition: opacity 0.8s ease-out;
}
#unity-canvas {
  position:absolute;
  background:#000;
  opacity: 0;
  transition: opacity 0.7s ease-in;
}
.loader {
  position:relative;
  width:460px;
  height:460px;
}
.logo {
  position:absolute;
  width:180px;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%) scale(1);
  will-change: transform;
}
.particle {
  position:absolute;
  width:36px;          /* в 2 раза больше */
  height:36px;
  background:#4fc3ff;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
  box-shadow: 0 0 12px #4fc3ff;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;

let unityReady = false;
let phase = "out";           // out → hover → in → bounce
let t = 0;
let floatStrength = 0.4;

// Тайминги
const OUT_DURATION = 1.15;       // вылет из центра
const HOVER_DELAY_AFTER_READY = 0.5;  // через 0.5 сек после готовности Unity начинаем возврат
const MIN_HOVER_TIME = 1.0;      // минимум парения перед возвратом
const IN_DURATION = 1.35;        // возврат в логотип
const BOUNCE_DURATION = 0.75;

const LERP_K = 16;

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw = w, dh = h;
  if (w / h > ASPECT) dh = w / ASPECT;
  else dw = h * ASPECT;

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== PARTICLES (теперь квадраты) =====
const COUNT = 9;
const MIN_R = 108, MAX_R = 195;   // чуть дальше, чтобы выглядело космичнее
let particles = [];
let currentPositions = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement("div");
  el.className = "particle";
  // Добавляем лёгкий поворот для динамики
  el.style.transformOrigin = "center";
  document.getElementById("loader").appendChild(el);

  particles.push({
    el: el,
    tx: 0, ty: 0,
    offset: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 2.8   // индивидуальная скорость вращения
  });
  currentPositions.push({ x: 0, y: 0, rot: 0 });
}

function initParticles() {
  for (let p of particles) {
    const angle = Math.random() * Math.PI * 2;
    const radius = MIN_R + Math.random() * (MAX_R - MIN_R);
    p.tx = Math.cos(angle) * radius;
    p.ty = Math.sin(angle) * radius;
  }
}

// ===== EASING =====
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;

// ===== MAIN LOOP =====
let last = performance.now();

function loop(now) {
  const dt = (now - last) * 0.001;
  last = now;
  t += dt;
  const globalTime = now * 0.0018;   // чуть медленнее для космического ощущения

  // ===================== PHASE MANAGEMENT =====================
  if (phase === "out" && t > OUT_DURATION) {
    phase = "hover";
    t = 0;
  }

  // Возврат начинается через 0.5 сек после готовности Unity
  if (phase === "hover" && unityReady && t >= HOVER_DELAY_AFTER_READY) {
    phase = "in";
    t = 0;
  }

  if (phase === "in" && t > IN_DURATION) {
    phase = "bounce";
    t = 0;
  }

  if (phase === "bounce" && t > BOUNCE_DURATION) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 720);
  }

  // Float strength (лёгкое парение как в космосе)
  const targetFloat = (phase === "hover") ? 1.25 : 0.42;
  floatStrength += (targetFloat - floatStrength) * 10 * dt;

  // ===================== PARTICLES ANIMATION =====================
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let baseX = 0, baseY = 0, alpha = 1;

    if (phase === "out") {
      const progress = easeOutCubic(Math.min(t / OUT_DURATION, 1));
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = progress * 0.95;
    }
    else if (phase === "hover") {
      baseX = p.tx;
      baseY = p.ty;
      alpha = 1;
    }
    else if (phase === "in") {
      const pVal = Math.min(t / IN_DURATION, 1);
      const progress = 1 - easeOutCubic(pVal);   // резкий старт возврата
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = Math.max(0, (1 - pVal) * 2.2);
    }
    else {
      alpha = 0;
    }

    // Плавный lerp
    const lerpFactor = 1 - Math.exp(-LERP_K * dt);
    currentPositions[i].x += (baseX - currentPositions[i].x) * lerpFactor;
    currentPositions[i].y += (baseY - currentPositions[i].y) * lerpFactor;

    // Парение + лёгкое вращение (эффект космоса)
    const fx = Math.sin(globalTime * 1.8 + p.offset) * 6.5;
    const fy = Math.cos(globalTime * 1.6 + p.offset * 1.3) * 6.5;

    const x = currentPositions[i].x + fx * floatStrength;
    const y = currentPositions[i].y + fy * floatStrength;

    // Вращение квадратов
    currentPositions[i].rot += p.rotSpeed * dt * 35;
    const rot = currentPositions[i].rot;

    p.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rot.toFixed(1)}deg)`;
    p.el.style.opacity = alpha.toFixed(3);
  }

  // ===================== LOGO BOUNCE =====================
  if (phase === "bounce") {
    let scale = 1;
    if (t < 0.23) scale = 1 + (t / 0.23) * 0.52;
    else if (t < 0.52) scale = 1.52 - ((t - 0.23) / 0.29) * 0.57;
    else scale = 0.95 + ((t - 0.52) / 0.15) * 0.08;

    logo.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY LOADING =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = `${buildUrl}/SC.loader.js`;

const config = {
  dataUrl: `${buildUrl}/SC.data.unityweb`,
  frameworkUrl: `${buildUrl}/SC.framework.js.unityweb`,
  codeUrl: `${buildUrl}/SC.wasm.unityweb`
};

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
    .then(() => {
      unityReady = true;
      console.log("%cUnity ready → return animation will start in 0.5s", "color:#4fc3ff");
    })
    .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
initParticles();
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
