<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slap Club</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  background: radial-gradient(circle at center, rgba(30,80,180,0.25) 0%, rgba(10,20,50,0.15) 30%, rgba(0,0,0,0) 70%), #000;
  transition: opacity 0.75s ease-out;
  will-change: opacity;
}
#unity-canvas {
  position:absolute;
  background:#000;
  opacity: 0;
  transition: opacity 0.65s ease-in;
  will-change: opacity;
}
.loader {
  position:relative;
  width:440px;
  height:440px;
}
.logo {
  position:absolute;
  width:180px;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%) scale(1);
  will-change: transform;
}
.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#4fc3ff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;

let unityReady = false;
let phase = "out";           // out → hover → in → bounce
let t = 0;
let floatStrength = 0.45;

// Настройки таймингов (можно подкручивать)
const OUT_DURATION = 1.25;
const MIN_HOVER_TIME = 1.1;     // сколько минимум парят круги после загрузки Unity
const IN_DURATION = 1.45;       // длительность возврата в логотип
const BOUNCE_DURATION = 0.72;   // длительность баунса логотипа

const LERP_K = 18;              // чем выше — тем быстрее и плавнее догоняет цель (убирает дёргание)

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw = w, dh = h;
  if (w / h > ASPECT) dh = w / ASPECT;
  else dw = h * ASPECT;

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 95, MAX_R = 170;
let circles = [];
let currentPositions = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement("div");
  el.className = "circle";
  document.getElementById("loader").appendChild(el);

  circles.push({
    el: el,
    tx: 0, ty: 0,
    offset: Math.random() * Math.PI * 2
  });
  currentPositions.push({ x: 0, y: 0 });
}

function initCircles() {
  for (let c of circles) {
    const angle = Math.random() * Math.PI * 2;
    const radius = MIN_R + Math.random() * (MAX_R - MIN_R);
    c.tx = Math.cos(angle) * radius;
    c.ty = Math.sin(angle) * radius;
  }
}

// ===== EASING =====
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;

// ===== MAIN LOOP =====
let last = performance.now();

function loop(now) {
  const dt = (now - last) * 0.001;
  last = now;
  t += dt;
  const globalTime = now * 0.002;

  // ===================== PHASE MANAGEMENT =====================
  if (phase === "out" && t > OUT_DURATION) {
    phase = "hover";
    t = 0;
  }

  // Переход в "in" ТОЛЬКО когда Unity готова + прошло минимум времени парения
  if (phase === "hover" && unityReady && t >= MIN_HOVER_TIME) {
    phase = "in";
    t = 0;
  }

  if (phase === "in" && t > IN_DURATION) {
    phase = "bounce";
    t = 0;
  }

  // Финальное скрытие обложки после баунса
  if (phase === "bounce" && t > BOUNCE_DURATION) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 700);
  }

  // Float strength
  const targetFloat = (phase === "hover") ? 1.18 : 0.45;
  floatStrength += (targetFloat - floatStrength) * 12 * dt;

  // ===================== CIRCLES ANIMATION =====================
  for (let i = 0; i < circles.length; i++) {
    const c = circles[i];
    let baseX = 0, baseY = 0, alpha = 1;

    if (phase === "out") {
      const p = Math.min(t / OUT_DURATION, 1);
      const progress = easeOutCubic(p);
      baseX = c.tx * progress;
      baseY = c.ty * progress;
      alpha = progress;
    }
    else if (phase === "hover") {
      baseX = c.tx;
      baseY = c.ty;
      alpha = 1;
    }
    else if (phase === "in") {
      const p = Math.min(t / IN_DURATION, 1);
      const progress = 1 - easeOutCubic(p);        // быстрый старт, плавное замедление у центра
      baseX = c.tx * progress;
      baseY = c.ty * progress;
      alpha = Math.max(0, (1 - p) * 1.8);          // красивый fade при возврате
    }
    else {
      alpha = 0;
    }

    // Плавный lerp (frame-rate independent) — главное исправление от дёргания
    const lerpFactor = 1 - Math.exp(-LERP_K * dt);
    currentPositions[i].x += (baseX - currentPositions[i].x) * lerpFactor;
    currentPositions[i].y += (baseY - currentPositions[i].y) * lerpFactor;

    const fx = Math.sin(globalTime + c.offset) * 5.5;
    const fy = Math.cos(globalTime + c.offset) * 5.5;

    const x = currentPositions[i].x + fx * floatStrength;
    const y = currentPositions[i].y + fy * floatStrength;

    c.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
    c.el.style.opacity = alpha.toFixed(3);
  }

  // ===================== LOGO BOUNCE =====================
  if (phase === "bounce") {
    let scale = 1;
    if (t < 0.24) scale = 1 + (t / 0.24) * 0.48;
    else if (t < 0.54) scale = 1.48 - ((t - 0.24) / 0.3) * 0.55;
    else scale = 0.93 + ((t - 0.54) / 0.14) * 0.07;

    logo.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY LOADING =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = `${buildUrl}/SC.loader.js`;

const config = {
  dataUrl: `${buildUrl}/SC.data.unityweb`,
  frameworkUrl: `${buildUrl}/SC.framework.js.unityweb`,
  codeUrl: `${buildUrl}/SC.wasm.unityweb`
};

script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    // Можно добавить прогресс-бар, если захочешь позже
  })
  .then(() => {
    unityReady = true;
    console.log("%cUnity ready → starting return animation", "color:#4fc3ff");
  })
  .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
initCircles();
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
