<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="x5-fullscreen" content="true">
<meta name="full-screen" content="yes">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Slap Club</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #000;
}

#fit-root {
  width: 100%;
  height: 100%;
  margin: auto;
  position: relative;
  overflow: hidden;
  transform: translateZ(0);
  background: #000;
}

#unity-container {
  width: 100%;
  height: 100%;
}

#unity-canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}
</style>
</head>

<body class="dark">

<div id="fit-root">
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
</div>

<!-- Loading -->
<div id="loading-cover" style="display:none;">
  <div id="unity-loading-bar">
    <div id="unity-logo"><img src="logo.png"></div>
    <div id="unity-progress-bar-empty" style="display:none;">
      <div id="unity-progress-bar-full"></div>
    </div>
    <div class="spinner"></div>
  </div>
</div>

<div id="unity-fullscreen-button" style="display:none;"></div>

<!-- Orientation warning -->
<div id="orientation-warning"
style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:white;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:99999;font-family:Arial,sans-serif;padding:20px;">
  <div style="font-size:80px;margin-bottom:20px;">🔄</div>
  <h2>Please rotate your device</h2>
  <p>This game requires landscape orientation.</p>
</div>

<script>

/* ======================================================
   ОРИЕНТАЦИЯ
====================================================== */

function checkOrientation() {
  const isLandscape = window.innerWidth > window.innerHeight;
  document.getElementById('orientation-warning').style.display =
    isLandscape ? 'none' : 'flex';
}

/* ======================================================
   PRODUCTION FIT SYSTEM (из первого примера)
====================================================== */

(function () {

  function fit(container, minRatioW, minRatioH, maxRatioW, maxRatioH) {

    var currentR = window.innerWidth / window.innerHeight;

    var minR = minRatioW / minRatioH;
    var maxR = maxRatioW / maxRatioH;

    var clampedR = Math.min(Math.max(currentR, minR), maxR);

    var width = window.innerWidth;
    var height = width / clampedR;

    if (height > window.innerHeight) {
      width = Math.min(width, Math.ceil(window.innerHeight * clampedR));
    }

    height = Math.floor(width / clampedR);

    container.style.width = width + "px";
    container.style.height = height + "px";
  }

  function applyFit() {
    var container = document.getElementById("fit-root");
    if (!container) return;

    /* 
       Здесь можно задать диапазон аспектов.
       Сейчас стоит почти без ограничений.
       Можем потом зажать под нужный диапазон.
    */
    fit(container, 1, 2340, 2620, 1);

    checkOrientation();
  }

  var rafId = null;

  function scheduleFit() {
    if (rafId !== null) cancelAnimationFrame(rafId);

    rafId = requestAnimationFrame(function () {
      rafId = null;
      applyFit();
    });
  }

  scheduleFit();

  window.addEventListener("load", scheduleFit);
  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", scheduleFit);

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleFit);
  }

  if ("ResizeObserver" in window) {
    var resizeObserver = new ResizeObserver(scheduleFit);
    resizeObserver.observe(document.documentElement);
  }

})();

/* ======================================================
   FULLSCREEN
====================================================== */

function tryEnterFullscreen() {
  const elem = document.documentElement;

  if (elem.requestFullscreen) {
    elem.requestFullscreen().catch(() => {});
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  }
}

/* ======================================================
   UNITY INIT
====================================================== */

const buildUrl = "Build";
const loaderUrl = buildUrl + "/SC.loader.js";

const config = {
  dataUrl: buildUrl + "/SC.data.unityweb",
  frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
  codeUrl: buildUrl + "/SC.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "aaaaa",
  productName: "Slap Club",
  productVersion: "1.0",
};

const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");
const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
const fullscreenButton = document.querySelector("#unity-fullscreen-button");
const spinner = document.querySelector('.spinner');

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
  config.devicePixelRatio = window.devicePixelRatio;
}

loadingCover.style.display = "";

const script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    spinner.style.display = "none";
    progressBarEmpty.style.display = "";
    progressBarFull.style.width = `${100 * progress}%`;
  }).then((unityInstance) => {

    loadingCover.style.display = "none";
    tryEnterFullscreen();

    canvas.addEventListener('touchstart', function firstTouch() {
      tryEnterFullscreen();
      canvas.removeEventListener('touchstart', firstTouch);
    }, { once: true });

    fullscreenButton.onclick = () => {
      unityInstance.SetFullscreen(1);
      tryEnterFullscreen();
    };

  }).catch(alert);
};

document.body.appendChild(script);

</script>
</body>
</html>
