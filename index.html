<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slap Club</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none; /* улучшает поведение на тач-устройствах */
  }

  #unity-canvas {
    position: absolute;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease-in;
    image-rendering: crisp-edges; /* помогает на мобильных */
  }

  #loading-cover {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    background: radial-gradient(circle at center, rgba(30,80,180,0.25) 0%, rgba(10,20,50,0.15) 30%, rgba(0,0,0,0) 70%), #000;
    transition: opacity 0.9s ease-out;
  }

  .loader {
    position: relative;
    width: 460px;
    height: 460px;
    z-index: 2;
  }

  .logo {
    position: absolute;
    width: 180px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    will-change: transform;
  }

  .particle {
    position: absolute;
    width: 36px;
    height: 36px;
    background: #4fc3ff;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    box-shadow: 0 0 14px #4fc3ff;
  }
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const TARGET_ASPECT = 1920 / 1080;   // строго 16:9

let unityReady = false;
let phase = "out";
let t = 0;
let floatStrength = 0.45;

const OUT_DURATION = 1.2;
const MIN_HOVER_TIME_AFTER_READY = 1.15;
const IN_DURATION = 1.45;
const BOUNCE_DURATION = 0.68;

const LERP_K = 18;

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");

// ===== УЛУЧШЕННЫЙ RESIZE — главное исправление =====
function resizeCanvas() {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;

  let canvasW, canvasH;

  // Вычисляем максимальный размер, который помещается при соотношении 16:9
  if (screenW / screenH > TARGET_ASPECT) {
    // Экран шире → ограничиваем по высоте (pillarbox — чёрные полосы слева/справа)
    canvasH = screenH;
    canvasW = Math.floor(screenH * TARGET_ASPECT);
  } else {
    // Экран уже → ограничиваем по ширине (letterbox — чёрные полосы сверху/снизу)
    canvasW = screenW;
    canvasH = Math.floor(screenW / TARGET_ASPECT);
  }

  // Применяем CSS-размер (видимый размер)
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";

  // Центрируем
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";

  // Важно для Unity: устанавливаем реальное разрешение рендера
  // Это решает проблему гигантского размера на мобильных
  canvas.width = canvasW;
  canvas.height = canvasH;
}

// ===== PARTICLES (оставил как было, только мелкие улучшения) =====
const COUNT = 9;
const MIN_R = 110, MAX_R = 200;
let particles = [];
let currentPositions = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement("div");
  el.className = "particle";
  el.style.transformOrigin = "center";
  document.getElementById("loader").appendChild(el);

  particles.push({
    el: el,
    tx: 0, ty: 0,
    offset: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 3.2
  });
  currentPositions.push({ x: 0, y: 0, rot: 0 });
}

function initParticles() {
  for (let p of particles) {
    const angle = Math.random() * Math.PI * 2;
    const radius = MIN_R + Math.random() * (MAX_R - MIN_R);
    p.tx = Math.cos(angle) * radius;
    p.ty = Math.sin(angle) * radius;
  }
}

// ===== EASING =====
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

// ===== MAIN LOOP (без изменений по анимации) =====
let last = performance.now();

function loop(now) {
  const dt = (now - last) * 0.001;
  last = now;
  t += dt;
  const globalTime = now * 0.0019;

  if (phase === "out" && t > OUT_DURATION) {
    phase = "hover";
    t = 0;
  }

  if (phase === "hover" && unityReady && t >= MIN_HOVER_TIME_AFTER_READY) {
    phase = "in";
    t = 0;
  }

  if (phase === "in" && t > IN_DURATION) {
    phase = "bounce";
    t = 0;
  }

  if (phase === "bounce" && t > BOUNCE_DURATION) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 780);
  }

  const targetFloat = (phase === "hover" || phase === "out") ? 1.28 : 0.4;
  floatStrength += (targetFloat - floatStrength) * 11 * dt;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let baseX = 0, baseY = 0, alpha = 1;

    if (phase === "out") {
      const progress = easeOutCubic(Math.min(t / OUT_DURATION, 1));
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = progress;
    } else if (phase === "hover") {
      baseX = p.tx;
      baseY = p.ty;
      alpha = 1;
    } else if (phase === "in") {
      const pVal = Math.min(t / IN_DURATION, 1);
      const progress = 1 - easeOutCubic(pVal);
      baseX = p.tx * progress;
      baseY = p.ty * progress;
      alpha = Math.max(0, (1 - pVal) * 2.4);
    } else {
      alpha = 0;
    }

    const lerpFactor = 1 - Math.exp(-LERP_K * dt);
    currentPositions[i].x += (baseX - currentPositions[i].x) * lerpFactor;
    currentPositions[i].y += (baseY - currentPositions[i].y) * lerpFactor;

    const fx = Math.sin(globalTime * 1.7 + p.offset) * 7;
    const fy = Math.cos(globalTime * 1.55 + p.offset * 1.4) * 6.8;

    const x = currentPositions[i].x + fx * floatStrength;
    const y = currentPositions[i].y + fy * floatStrength;

    currentPositions[i].rot += p.rotSpeed * dt * 38;
    const rot = currentPositions[i].rot;

    p.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rot.toFixed(1)}deg)`;
    p.el.style.opacity = alpha.toFixed(3);
  }

  // Лёгкий баунс логотипа
  if (phase === "bounce") {
    let scale = 1;
    if (t < 0.22) scale = 1 + (t / 0.22) * 0.38;
    else if (t < 0.48) scale = 1.38 - ((t - 0.22) / 0.26) * 0.43;
    else scale = 0.95 + ((t - 0.48) / 0.14) * 0.06;

    logo.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY LOADING =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = `${buildUrl}/SC.loader.js`;

const config = {
  dataUrl: `${buildUrl}/SC.data.unityweb`,
  frameworkUrl: `${buildUrl}/SC.framework.js.unityweb`,
  codeUrl: `${buildUrl}/SC.wasm.unityweb`,
  // matchWebGLToCanvasSize оставляем по умолчанию true — Unity будет подстраиваться под canvas.width/height
};

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
    .then(() => {
      unityReady = true;
      console.log("%cUnity ready", "color:#4fc3ff");
    })
    .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
initParticles();
resizeCanvas();
requestAnimationFrame(loop);

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 100); // небольшая задержка после смены ориентации
});
</script>
</body>
</html>
