<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;

let unityReady = false;
let phase = "out";
let t = 0;
let last = performance.now();

let floatStrength = 0.5;

let returnStarted = false;
let returnDelay = 0;

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw, dh;

  if (w / h > ASPECT) {
    dh = h;
    dw = h * ASPECT;
  } else {
    dw = w;
    dh = w / ASPECT;
  }

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 95, MAX_R = 170;

let circles = [];
let currentPositions = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement("div");
  el.className = "circle";
  document.getElementById("loader").appendChild(el);

  circles.push({
    el,
    tx: 0,
    ty: 0,
    offset: Math.random() * Math.PI * 2
  });

  currentPositions.push({ x: 0, y: 0 });
}

function initCircles() {
  for (let c of circles) {
    const a = Math.random() * Math.PI * 2;
    const r = MIN_R + Math.random() * (MAX_R - MIN_R);
    c.tx = Math.cos(a) * r;
    c.ty = Math.sin(a) * r;
  }
}

// ===== EASING =====
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;

// ===== LOOP =====
function loop(now) {
  let dt = (now - last) * 0.001;
  last = now;

  if (dt > 0.033) dt = 0.033;

  t += dt;

  const globalTime = now * 0.002;

  // ===== PHASES =====

  if (phase === "out" && t > 1.25) {
    phase = "hover";
    t = 0;
  }

  if (phase === "hover" && unityReady && !returnStarted) {
    returnStarted = true;
    returnDelay = 0;
  }

  if (returnStarted && phase === "hover") {
    returnDelay += dt;

    if (returnDelay > 0.2) {
      phase = "in";
      t = 0;
    }
  }

  if (phase === "in" && t > 1.2) {
    phase = "bounce";
    t = 0;
  }

  if (phase === "bounce" && t > 0.65) {
    cover.style.opacity = "0";

    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 600);
  }

  // ===== FLOAT =====
  let targetFloat = (phase === "hover") ? 1.15 : 0.4;
  floatStrength += (targetFloat - floatStrength) * 8 * dt;

  // ===== CIRCLES =====
  for (let i = 0; i < circles.length; i++) {
    const c = circles[i];

    let baseX = 0, baseY = 0, alpha = 1;

    if (phase === "out") {
      const p = easeOut(Math.min(t / 1.2, 1));
      baseX = c.tx * p;
      baseY = c.ty * p;
      alpha = p;
    } 
    else if (phase === "hover") {
      baseX = c.tx;
      baseY = c.ty;
      alpha = 1;
    } 
    else if (phase === "in") {
      const p = 1 - easeIn(Math.min(t / 1.2, 1));
      baseX = c.tx * p;
      baseY = c.ty * p;
      alpha = p;
    } 
    else {
      alpha = 0;
    }

    // плавный lerp (без дергания)
    currentPositions[i].x += (baseX - currentPositions[i].x) * 0.14;
    currentPositions[i].y += (baseY - currentPositions[i].y) * 0.14;

    const fx = Math.sin(globalTime + c.offset) * 5;
    const fy = Math.cos(globalTime + c.offset) * 5;

    const x = currentPositions[i].x + fx * floatStrength;
    const y = currentPositions[i].y + fy * floatStrength;

    c.el.style.transform =
      `translate(-50%, -50%) translate(${x}px, ${y}px)`;

    c.el.style.opacity = alpha;
  }

  // ===== LOGO =====
  if (phase === "bounce") {
    let scale = 1;

    if (t < 0.25) {
      scale = 1 + (t / 0.25) * 0.45;
    } else if (t < 0.55) {
      scale = 1.45 - ((t - 0.25) / 0.3) * 0.5;
    } else {
      scale = 0.95 + ((t - 0.55) / 0.15) * 0.05;
    }

    logo.style.transform =
      `translate(-50%, -50%) scale(${scale})`;
  } else {
    logo.style.transform =
      `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = `${buildUrl}/SC.loader.js`;

const config = {
  dataUrl: `${buildUrl}/SC.data.unityweb`,
  frameworkUrl: `${buildUrl}/SC.framework.js.unityweb`,
  codeUrl: `${buildUrl}/SC.wasm.unityweb`
};

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
    .then(() => {
      unityReady = true;
      console.log("Unity ready");
    })
    .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
initCircles();
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener("resize", resizeCanvas);
</script>
