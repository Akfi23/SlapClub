<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Slap Club</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    #unity-canvas {
      background: #000000;
      display: block;
    }
  </style>
</head>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.png"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    // ============ РЕСАЙЗ ПОД 1920x1080 (ВСЕГДА LANDSCAPE) ============
    const GAME_ASPECT = 1920 / 1080;

    function resizeCanvas() {
      const container = document.getElementById("unity-container");
      const canvas = document.getElementById("unity-canvas");

      if (!container || !canvas) return;

      setTimeout(() => {
        const containerWidth = window.innerWidth;
        const containerHeight = window.innerHeight;
        const containerAspect = containerWidth / containerHeight;

        let drawWidth, drawHeight;

        if (containerAspect > GAME_ASPECT) {
          drawHeight = containerHeight;
          drawWidth = containerHeight * GAME_ASPECT;
        } else {
          drawWidth = containerWidth;
          drawHeight = containerWidth / GAME_ASPECT;
        }

        canvas.style.setProperty('width', `${drawWidth}px`, 'important');
        canvas.style.setProperty('height', `${drawHeight}px`, 'important');

        canvas.style.position = 'absolute';
        canvas.style.left = '50%';
        canvas.style.top = '50%';
        canvas.style.transform = 'translate(-50%, -50%)';

      }, 100);
    }

    // ============ ИНИЦИАЛИЗАЦИЯ UNITY ============
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/SC.loader.js";

    const config = {
      dataUrl: buildUrl + "/SC.data.unityweb",
      frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
      codeUrl: buildUrl + "/SC.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "aaaaa",
      productName: "Slap Club",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = window.devicePixelRatio;
    }

    loadingCover.style.display = "";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        loadingCover.style.display = "none";

        // применяем фиксированный 16:9
        resizeCanvas();

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

    // слушаем ресайз
    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("orientationchange", () => {
      resizeCanvas();
      setTimeout(resizeCanvas, 500);
    });

    window.addEventListener('load', () => {
      resizeCanvas();
    });
  </script>
</body>

</html>
