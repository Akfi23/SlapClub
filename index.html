<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">

<title>Slap Club</title>

<style>
body {
  margin:0;
  overflow:hidden;

  /* 🔥 glow фон */
  background: radial-gradient(circle at center,
    #0a1f3d 0%,
    #050b1a 40%,
    #000 80%);
}

/* UNITY */
#unity-canvas {
  position:absolute;
}

/* LOADER */
#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.loader {
  position:relative;
  width:400px;
  height:400px;
}

/* 🔥 LOGO */
.logo {
  position:absolute;
  width:120px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1);
  will-change: transform;
}

/* circles */
.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#3fa9ff;
  border-radius:50%;
  top:50%;
  left:50%;

  transform:translate3d(-50%,-50%,0);
  opacity:0;

  will-change: transform, opacity;
}
</style>
</head>

<body>

<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== RESIZE =====
const ASPECT = 1920/1080;
function resizeCanvas(){
  const c = document.getElementById("unity-canvas");
  const w = innerWidth, h = innerHeight;

  let dw,dh;
  if (w/h>ASPECT){ dh=h; dw=h*ASPECT; }
  else { dw=w; dh=w/ASPECT; }

  c.style.width=dw+"px";
  c.style.height=dh+"px";
  c.style.left="50%";
  c.style.top="50%";
  c.style.transform="translate(-50%,-50%)";
}

// ===== STATE =====
let unityReady=false;
let mode="fly";
let t=0;

// ===== ELEMENTS =====
const loader=document.getElementById("loader");
const logo=document.getElementById("logo");

// ===== CIRCLES =====
const COUNT=9;
const MIN_R=80, MAX_R=140;

let circles=[];

for(let i=0;i<COUNT;i++){
  let el=document.createElement("div");
  el.className="circle";
  loader.appendChild(el);

  circles.push({
    el,
    x:0,y:0,
    phase:Math.random()*6.28
  });
}

function regen(){
  for(let c of circles){
    let a=Math.random()*6.28;
    let r=MIN_R+Math.random()*(MAX_R-MIN_R);
    c.x=Math.cos(a)*r;
    c.y=Math.sin(a)*r;
  }
}

// easing
const easeOut=t=>1-(1-t)*(1-t)*(1-t);
const easeIn=t=>t*t*t;

// ===== LOOP =====
let last=performance.now();

function loop(now){
  let dt=(now-last)*0.001;
  last=now;

  t+=dt;

  // state switch
  if(mode==="fly" && t>1){
    mode="hover";
  }

  if(mode==="hover" && unityReady){
    mode="return";
    t=0;
  }

  if(mode==="return" && t>1){
    hide();
    return;
  }

  let time = now*0.002;

  for(let c of circles){

    let baseX=0, baseY=0, alpha=1;

    if(mode==="fly"){
      let k=easeOut(t);
      baseX=c.x*k;
      baseY=c.y*k;
      alpha=t;
    }

    if(mode==="hover"){
      baseX=c.x;
      baseY=c.y;
    }

    if(mode==="return"){
      let k=1-easeIn(t);
      baseX=c.x*k;
      baseY=c.y*k;

      bounceLogo(t);
    }

    let floatX=Math.sin(time+c.phase)*4;
    let floatY=Math.cos(time+c.phase)*4;

    let strength=(mode==="hover")?1:0.5;

    let x=baseX+floatX*strength;
    let y=baseY+floatY*strength;

    c.el.style.transform =
      `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), 0)`;

    c.el.style.opacity=alpha;
  }

  requestAnimationFrame(loop);
}

// ===== BOUNCE =====
function bounceLogo(t){
  let s;
  if(t<0.5) s=1+t*0.3;
  else s=1.15-(t-0.5)*0.5;

  logo.style.transform =
    `translate(-50%,-50%) scale(${s})`;
}

// ===== HIDE =====
function hide(){
  const cover=document.getElementById("loading-cover");
  cover.style.transition="opacity .4s";
  cover.style.opacity=0;

  setTimeout(()=>cover.style.display="none",400);
}

// ===== UNITY =====
const buildUrl="Build";
const script=document.createElement("script");
script.src=buildUrl+"/SC.loader.js";

const config={
  dataUrl: buildUrl+"/SC.data.unityweb",
  frameworkUrl: buildUrl+"/SC.framework.js.unityweb",
  codeUrl: buildUrl+"/SC.wasm.unityweb"
};

script.onload=()=>{
  createUnityInstance(document.getElementById("unity-canvas"), config, ()=>{})
  .then(()=>{
    unityReady=true;
  });
};

document.body.appendChild(script);

// start
regen();
resizeCanvas();
requestAnimationFrame(loop);

addEventListener("resize",resizeCanvas);
</script>

</body>
</html>
