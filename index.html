<script>
// ===== RESIZE =====
const ASPECT = 1920/1080;
function resizeCanvas(){
  const c = document.getElementById("unity-canvas");
  const w = innerWidth, h = innerHeight;

  let dw,dh;
  if (w/h>ASPECT){ dh=h; dw=h*ASPECT; }
  else { dw=w; dh=w/ASPECT; }

  c.style.width=dw+"px";
  c.style.height=dh+"px";
  c.style.left="50%";
  c.style.top="50%";
  c.style.transform="translate(-50%,-50%)";
}

// ===== STATE =====
let unityReady=false;
let mode="fly";
let t=0;
let hoverTime=0;

// ===== ELEMENTS =====
const loader=document.getElementById("loader");
const logo=document.getElementById("logo");
const canvas=document.getElementById("unity-canvas");

// Unity скрыта до конца анимации
canvas.style.opacity = 0;

// ===== CIRCLES =====
const COUNT=9;
const MIN_R=80, MAX_R=140;

let circles=[];

for(let i=0;i<COUNT;i++){
  let el=document.createElement("div");
  el.className="circle";
  loader.appendChild(el);

  circles.push({
    el,
    x:0,y:0,
    offset:Math.random()*6.28
  });
}

function regen(){
  for(let c of circles){
    let a=Math.random()*6.28;
    let r=MIN_R+Math.random()*(MAX_R-MIN_R);
    c.x=Math.cos(a)*r;
    c.y=Math.sin(a)*r;
  }
}

// easing
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

// ===== LOOP =====
let last=performance.now();

function loop(now){
  let dt=(now-last)*0.001;
  last=now;

  t+=dt;

  if(mode==="fly" && t>1){
    mode="hover";
  }

  // удерживаем hover минимум немного времени
  if(mode==="hover"){
    hoverTime += dt;

    if(unityReady && hoverTime > 0.6){
      mode="return";
      t=0;
      hoverTime=0;
    }
  }

  if(mode==="return" && t>1){
    mode="bounce";
    t=0;
  }

  if(mode==="bounce" && t>0.8){
    finishLoading();
    return;
  }

  let time = now*0.002;

  for(let c of circles){

    let baseX=0, baseY=0, alpha=1;

    if(mode==="fly"){
      let k=easeOut(t);
      baseX=c.x*k;
      baseY=c.y*k;
      alpha=t;
    }

    else if(mode==="hover"){
      baseX=c.x;
      baseY=c.y;
      alpha=1;
    }

    else if(mode==="return"){
      let k=1 - easeIn(t);
      baseX=c.x*k;
      baseY=c.y*k;
      alpha=1;
    }

    else if(mode==="bounce"){
      baseX=0;
      baseY=0;
      alpha=0;
    }

    let floatX=Math.sin(time + c.offset)*5;
    let floatY=Math.cos(time + c.offset)*5;

    let strength = (mode==="hover") ? 1 : 0.4;

    let x=baseX + floatX*strength;
    let y=baseY + floatY*strength;

    c.el.style.transform =
      `translate(-50%,-50%) translate(${x}px,${y}px)`;

    c.el.style.opacity=alpha;
  }

  // LOGO BOUNCE
  if(mode==="bounce"){
    let s;

    if(t < 0.3) {
      s = 1 + t * 0.6;
    }
    else {
      s = 1.18 - (t - 0.3) * 0.6;
    }

    logo.style.transform =
      `translate(-50%,-50%) scale(${s})`;
  }
  else {
    logo.style.transform =
      `translate(-50%,-50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== FINAL SHOW =====
function finishLoading(){
  const cover=document.getElementById("loading-cover");

  cover.style.transition="opacity .4s";
  cover.style.opacity=0;

  // показываем игру
  canvas.style.transition="opacity .6s";
  canvas.style.opacity=1;

  setTimeout(()=>{
    cover.style.display="none";
  },400);
}

// ===== UNITY =====
const buildUrl="Build";
const script=document.createElement("script");
script.src=buildUrl+"/SC.loader.js";

const config={
  dataUrl: buildUrl+"/SC.data.unityweb",
  frameworkUrl: buildUrl+"/SC.framework.js.unityweb",
  codeUrl: buildUrl+"/SC.wasm.unityweb"
};

script.onload=()=>{
  createUnityInstance(document.getElementById("unity-canvas"), config, ()=>{})
  .then(()=>{
    unityReady=true;
  });
};

document.body.appendChild(script);

// start
regen();
resizeCanvas();
requestAnimationFrame(loop);

addEventListener("resize",resizeCanvas);
</script>
