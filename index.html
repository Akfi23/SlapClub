<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">

<title>Slap Club</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:#000;
}

/* мягкий glow поверх */
#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;

  background:
    radial-gradient(circle at center,
      rgba(30,80,180,0.25) 0%,
      rgba(10,20,50,0.15) 30%,
      rgba(0,0,0,0) 70%),
    #000;
}

/* UNITY */
#unity-canvas {
  position:absolute;
  background:#000;
}

.loader {
  position:relative;
  width:400px;
  height:400px;
}

/* LOGO */
.logo {
  position:absolute;
  width:120px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1);
  will-change: transform;
}

/* circles */
.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#4fc3ff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;

  will-change: transform, opacity;
}
</style>
</head>

<body>

<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== RESIZE =====
const ASPECT = 1920/1080;
function resizeCanvas(){
  const c = document.getElementById("unity-canvas");
  const w = innerWidth, h = innerHeight;

  let dw,dh;
  if (w/h>ASPECT){ dh=h; dw=h*ASPECT; }
  else { dw=w; dh=w/ASPECT; }

  c.style.width=dw+"px";
  c.style.height=dh+"px";
  c.style.left="50%";
  c.style.top="50%";
  c.style.transform="translate(-50%,-50%)";
}

// ===== STATE =====
let unityReady=false;
let mode="fly";
let t=0;

// ===== ELEMENTS =====
const loader=document.getElementById("loader");
const logo=document.getElementById("logo");

// ===== CIRCLES =====
const COUNT=9;
const MIN_R=80, MAX_R=140;

let circles=[];

for(let i=0;i<COUNT;i++){
  let el=document.createElement("div");
  el.className="circle";
  loader.appendChild(el);

  circles.push({
    el,
    x:0,y:0,
    offset:Math.random()*6.28
  });
}

function regen(){
  for(let c of circles){
    let a=Math.random()*6.28;
    let r=MIN_R+Math.random()*(MAX_R-MIN_R);
    c.x=Math.cos(a)*r;
    c.y=Math.sin(a)*r;
  }
}

// easing (вернул нормальные)
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

// ===== LOOP =====
let last=performance.now();

function loop(now){
  let dt=(now-last)*0.001;
  last=now;

  t+=dt;

  if(mode==="fly" && t>1){
    mode="hover";
  }

  if(mode==="hover" && unityReady){
    mode="return";
    t=0;
  }

  if(mode==="return" && t>1){
    mode="bounce";
    t=0;
  }

  if(mode==="bounce" && t>0.5){
    hide();
    return;
  }

  let time = now*0.002;

  for(let c of circles){

    let baseX=0, baseY=0, alpha=1;

    if(mode==="fly"){
      let k=easeOut(t);
      baseX=c.x*k;
      baseY=c.y*k;
      alpha=t;
    }

    else if(mode==="hover"){
      baseX=c.x;
      baseY=c.y;
      alpha=1;
    }

    else if(mode==="return"){
      let k=1 - easeIn(t);
      baseX=c.x*k;
      baseY=c.y*k;
      alpha=1;
    }

    else if(mode==="bounce"){
      baseX=0;
      baseY=0;
      alpha=0;
    }

    // парение (как было — плавное)
    let floatX=Math.sin(time + c.offset)*5;
    let floatY=Math.cos(time + c.offset)*5;

    let strength = (mode==="hover") ? 1 : 0.4;

    let x=baseX + floatX*strength;
    let y=baseY + floatY*strength;

    c.el.style.transform =
      `translate(-50%,-50%) translate(${x}px,${y}px)`;

    c.el.style.opacity=alpha;
  }

  // 👉 НОРМАЛЬНЫЙ БОУНС ЛОГО
  if(mode==="bounce"){
    let s;

    if(t < 0.3) {
      s = 1 + t * 0.6;   // сильный ап
    }
    else {
      s = 1.18 - (t - 0.3) * 0.6; // возврат
    }

    logo.style.transform =
      `translate(-50%,-50%) scale(${s})`;
  }
  else {
    logo.style.transform =
      `translate(-50%,-50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== HIDE =====
function hide(){
  const cover=document.getElementById("loading-cover");
  cover.style.transition="opacity .4s";
  cover.style.opacity=0;

  setTimeout(()=>cover.style.display="none",400);
}

// ===== UNITY =====
const buildUrl="Build";
const script=document.createElement("script");
script.src=buildUrl+"/SC.loader.js";

const config={
  dataUrl: buildUrl+"/SC.data.unityweb",
  frameworkUrl: buildUrl+"/SC.framework.js.unityweb",
  codeUrl: buildUrl+"/SC.wasm.unityweb"
};

script.onload=()=>{
  createUnityInstance(document.getElementById("unity-canvas"), config, ()=>{})
  .then(()=>{
    unityReady=true;
  });
};

document.body.appendChild(script);

// start
regen();
resizeCanvas();
requestAnimationFrame(loop);

addEventListener("resize",resizeCanvas);
</script>

</body>
</html>
