<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slap Club</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:#000;
}

#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  background:
    radial-gradient(circle at center,
      rgba(30,80,180,0.25) 0%,
      rgba(10,20,50,0.15) 30%,
      rgba(0,0,0,0) 70%),
    #000;
  transition: opacity 0.6s ease-out;
}

#unity-canvas {
  position:absolute;
  background:#000;
  opacity: 0;
  transition: opacity 0.5s ease-in;
  will-change: opacity;
}

.loader {
  position:relative;
  width:400px;
  height:400px;
}

.logo {
  position:absolute;
  width:120px;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%) scale(1);
  will-change: transform;
  transition: transform 0.08s linear; /* для плавности баунса */
}

.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#4fc3ff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;
let unityReady = false;
let animationFinished = false;
let t = 0;
let mode = "fly";

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");
const loader = document.getElementById("loader");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw, dh;
  if (w / h > ASPECT) { dh = h; dw = h * ASPECT; }
  else { dw = w; dh = w / ASPECT; }

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 80, MAX_R = 140;
let circles = [];

for (let i = 0; i < COUNT; i++) {
  let el = document.createElement("div");
  el.className = "circle";
  loader.appendChild(el);
  circles.push({
    el: el,
    x: 0, y: 0,
    offset: Math.random() * Math.PI * 2
  });
}

function regen() {
  for (let c of circles) {
    let a = Math.random() * Math.PI * 2;
    let r = MIN_R + Math.random() * (MAX_R - MIN_R);
    c.x = Math.cos(a) * r;
    c.y = Math.sin(a) * r;
  }
}

// ===== EASING =====
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;

// ===== LOOP =====
let last = performance.now();

function loop(now) {
  let dt = (now - last) * 0.001;
  last = now;
  t += dt;

  // Режимы анимации
  if (mode === "fly" && t > 1.0)      { mode = "hover"; t = 0; }
  if (mode === "hover" && t > 1.4)    { mode = "return"; t = 0; }
  if (mode === "return" && t > 1.0)   { mode = "bounce"; t = 0; }
  if (mode === "bounce" && t > 0.68) {
    animationFinished = true;
    checkShowGame();
  }

  const time = now * 0.002;

  for (let c of circles) {
    let baseX = 0, baseY = 0, alpha = 1;

    if (mode === "fly") {
      const k = easeOut(t);
      baseX = c.x * k;
      baseY = c.y * k;
      alpha = Math.min(t * 1.6, 1);
    } else if (mode === "hover") {
      baseX = c.x;
      baseY = c.y;
      alpha = 1;
    } else if (mode === "return") {
      const k = 1 - easeIn(t);
      baseX = c.x * k;
      baseY = c.y * k;
      alpha = 1;
    } else if (mode === "bounce") {
      baseX = 0;
      baseY = 0;
      alpha = Math.max(1 - t * 3, 0);   // быстро гасим круги
    }

    const floatX = Math.sin(time + c.offset) * 5;
    const floatY = Math.cos(time + c.offset) * 5;
    const strength = (mode === "hover") ? 1.1 : 0.45;

    const x = baseX + floatX * strength;
    const y = baseY + floatY * strength;

    c.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
    c.el.style.opacity = alpha;
  }

  // === БАУНС ЛОГО (исправленный и красивый) ===
  if (mode === "bounce") {
    let s = 1;
    if (t < 0.22) {
      s = 1 + (t / 0.22) * 0.85;           // сильный взлёт
    } else if (t < 0.48) {
      s = 1.85 - ((t - 0.22) / 0.26) * 0.92; // мягкий возврат вниз
    } else {
      s = 0.93 + ((t - 0.48) / 0.20) * 0.07; // лёгкая осадка
    }
    logo.style.transform = `translate(-50%, -50%) scale(${s.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== SHOW GAME =====
function checkShowGame() {
  if (unityReady && animationFinished) {
    cover.style.opacity = "0";

    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 650);
  }
}

// ===== UNITY =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = buildUrl + "/SC.loader.js";

const config = {
  dataUrl: buildUrl + "/SC.data.unityweb",
  frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
  codeUrl: buildUrl + "/SC.wasm.unityweb"
};

script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    // Здесь можно добавить свой прогресс-бар, если захочешь позже
  })
  .then(() => {
    unityReady = true;
    checkShowGame();
  })
  .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
regen();
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
