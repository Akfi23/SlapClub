<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slap Club</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:#000;
}

#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  background:
    radial-gradient(circle at center,
      rgba(30,80,180,0.25) 0%,
      rgba(10,20,50,0.15) 30%,
      rgba(0,0,0,0) 70%),
    #000;
  transition: opacity 0.6s ease-out;
  will-change: opacity;
}

#unity-canvas {
  position:absolute;
  background:#000;
  opacity: 0;
  transition: opacity 0.5s ease-in;
  will-change: opacity;
}

.loader {
  position:relative;
  width:420px;
  height:420px;
}

.logo {
  position:absolute;
  width:180px;                    /* ← Сделали больше */
  top:50%;
  left:50%;
  transform: translate(-50%, -50%) scale(1);
  will-change: transform;
}

.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#4fc3ff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;
let unityReady = false;
let animationStarted = false;   // когда начинаем fly → return → bounce
let animationFinished = false;
let t = 0;
let mode = "hover";             // начинаем сразу с парения

let floatStrength = 0.5;

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");
const loader = document.getElementById("loader");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw, dh;
  if (w / h > ASPECT) { dh = h; dw = h * ASPECT; }
  else { dw = w; dh = w / ASPECT; }

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 95, MAX_R = 165;   // чуть дальше от центра из-за большего логотипа
let circles = [];

for (let i = 0; i < COUNT; i++) {
  let el = document.createElement("div");
  el.className = "circle";
  loader.appendChild(el);
  circles.push({
    el: el,
    x: 0, y: 0,
    offset: Math.random() * Math.PI * 2
  });
}

function regen() {
  for (let c of circles) {
    let a = Math.random() * Math.PI * 2;
    let r = MIN_R + Math.random() * (MAX_R - MIN_R);
    c.x = Math.cos(a) * r;
    c.y = Math.sin(a) * r;
  }
}

// ===== EASING =====
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;

// ===== LOOP =====
let last = performance.now();

function loop(now) {
  let dt = (now - last) * 0.001;
  last = now;
  t += dt;

  const time = now * 0.002;

  // === ЛОГИКА РЕЖИМОВ ===
  if (unityReady && !animationStarted) {
    animationStarted = true;
    mode = "fly";
    t = 0;
  }

  if (animationStarted) {
    if (mode === "fly" && t > 1.0)     { mode = "return"; t = 0; }
    if (mode === "return" && t > 1.0)  { mode = "bounce"; t = 0; }
    if (mode === "bounce" && t > 0.65) {
      animationFinished = true;
      checkShowGame();
    }
  }

  // Плавный lerp силы парения
  let targetStrength = 1.15;
  if (mode === "fly" || mode === "return") targetStrength = 0.6;
  if (mode === "bounce") targetStrength = 0.15;

  floatStrength += (targetStrength - floatStrength) * (14 * dt);

  for (let c of circles) {
    let baseX = 0, baseY = 0, alpha = 1;

    if (mode === "fly") {
      const k = easeOut(t);
      baseX = c.x * k;
      baseY = c.y * k;
      alpha = Math.min(t * 1.8, 1);
    } 
    else if (mode === "return") {
      const k = 1 - easeIn(t);
      baseX = c.x * k;
      baseY = c.y * k;
      alpha = 1;
    } 
    else if (mode === "bounce") {
      baseX = 0;
      baseY = 0;
      alpha = Math.max(1 - (t * 4), 0);
    }
    // в hover — baseX/Y = 0 (круги уже на позиции парения)

    const floatX = Math.sin(time + c.offset) * 5.2;
    const floatY = Math.cos(time + c.offset) * 5.2;

    const x = baseX + floatX * floatStrength;
    const y = baseY + floatY * floatStrength;

    c.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
    c.el.style.opacity = alpha;
  }

  // === МЯГКИЙ БАУНС ЛОГО ===
  if (mode === "bounce") {
    let s = 1;
    if (t < 0.25) {
      s = 1 + (t / 0.25) * 0.55;           // мягкий подъём
    } else if (t < 0.55) {
      s = 1.55 - ((t - 0.25) / 0.30) * 0.62; // плавный возврат
    } else {
      s = 0.93 + ((t - 0.55) / 0.10) * 0.07; // лёгкая осадка
    }
    logo.style.transform = `translate(-50%, -50%) scale(${s.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== SHOW GAME =====
function checkShowGame() {
  if (unityReady && animationFinished) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 600);
  }
}

// ===== UNITY =====
const buildUrl = "Build";
const script = document.createElement("script");
script.src = buildUrl + "/SC.loader.js";

const config = {
  dataUrl: buildUrl + "/SC.data.unityweb",
  frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
  codeUrl: buildUrl + "/SC.wasm.unityweb"
};

script.onload = () => {
  createUnityInstance(canvas, config, () => {})
  .then(() => {
    unityReady = true;
    // Анимация fly начнётся автоматически в loop()
  })
  .catch(err => console.error("Unity load error:", err));
};

document.body.appendChild(script);

// ===== START =====
regen();
resizeCanvas();
requestAnimationFrame(loop);
window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
