<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Unity Web Player | Slap Club</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #231F20;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #unity-canvas {
      background: #231F20;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<script src="Build/SC.loader.js"></script>
<script>
  const BUILD_VERSION = Date.now();

  const GAME_ASPECT = 1920 / 1080;

  function resizeCanvas() {
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");

    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const containerAspect = containerWidth / containerHeight;

    let drawWidth, drawHeight;

    if (containerAspect > GAME_ASPECT) {
      drawHeight = containerHeight;
      drawWidth = containerHeight * GAME_ASPECT;
    } else {
      drawWidth = containerWidth;
      drawHeight = containerWidth / GAME_ASPECT;
    }

    canvas.style.width = drawWidth + "px";
    canvas.style.height = drawHeight + "px";
  }

  createUnityInstance(document.querySelector("#unity-canvas"), {
    arguments: [],
    dataUrl: `Build/SC.data?${BUILD_VERSION}`,
    frameworkUrl: `Build/SC.framework.js?${BUILD_VERSION}`,
    codeUrl: `Build/SC.wasm?${BUILD_VERSION}`,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "aaaaa",
    productName: "Slap Club",
    productVersion: "1.0"
  }).then(() => {
    resizeCanvas();
  });

  window.addEventListener("resize", resizeCanvas);
</script>
</body>
</html>
