<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- Блокировка вертикальной ориентации -->
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <meta name="full-screen" content="yes">

  <!-- Запрет кэширования -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Slap Club</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #000000; /* ← Чёрный фон */
    }

    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000; /* ← Чёрный фон контейнера */
    }

    #unity-canvas {
      background: #000000; /* ← Чёрный фон канвы */
      display: block;
    }
  </style>
</head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-cover" style="display:none;">
  <div id="unity-loading-bar">
    <div id="unity-logo"><img src="logo.png"></div>
    <div id="unity-progress-bar-empty" style="display: none;">
      <div id="unity-progress-bar-full"></div>
    </div>
    <div class="spinner"></div>
  </div>
</div>
<div id="unity-fullscreen-button" style="display: none;"></div>

<!-- Оверлей предупреждения об ориентации -->
<div id="orientation-warning" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:white;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:99999;font-family:Arial,sans-serif;padding:20px;">
  <div style="font-size:80px;margin-bottom:20px;">🔄</div>
  <h2 style="font-size:28px;margin-bottom:15px;">Please rotate your device</h2>
  <p style="font-size:18px;max-width:400px;">This game requires landscape orientation (horizontal).</p>
</div>

<script>
  // ============ ЛОГИКА ОРИЕНТАЦИИ ============
  function checkOrientation() {
    const isLandscape = window.innerWidth > window.innerHeight;
    document.getElementById('orientation-warning').style.display = isLandscape ? 'none' : 'flex';
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);

  // ============ ЛОГИКА РЕСАЙЗА 1920×1080 ============
  const GAME_ASPECT = 1920 / 1080; // 16:9

  function resizeCanvas() {
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");

    if (!container || !canvas) return;

    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const containerAspect = containerWidth / containerHeight;

    let drawWidth, drawHeight;

    if (containerAspect > GAME_ASPECT) {
      // Широкий контейнер → масштаб по высоте (чёрные полосы по бокам)
      drawHeight = containerHeight;
      drawWidth = containerHeight * GAME_ASPECT;
    } else {
      // Узкий/портретный → масштаб по ширине (чёрные полосы сверху/снизу)
      drawWidth = containerWidth;
      drawHeight = containerWidth / GAME_ASPECT;
    }

    canvas.style.width = `${drawWidth}px`;
    canvas.style.height = `${drawHeight}px`;
  }

  // ============ ИНИЦИАЛИЗАЦИЯ UNITY ============
  const hideFullScreenButton = "";
  const buildUrl = "Build";
  const loaderUrl = buildUrl + "/SC.loader.js";
  const config = {
    dataUrl: buildUrl + "/SC.data.unityweb",
    frameworkUrl: buildUrl + "/SC.framework.js.unityweb",
    codeUrl: buildUrl + "/SC.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "aaaaa",
    productName: "Slap Club",
    productVersion: "1.0",
  };

  const container = document.querySelector("#unity-container");
  const canvas = document.querySelector("#unity-canvas");
  const loadingCover = document.querySelector("#loading-cover");
  const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const fullscreenButton = document.querySelector("#unity-fullscreen-button");
  const spinner = document.querySelector('.spinner');

  const canFullscreen = (function() {
    for (const key of [
      'exitFullscreen',
      'webkitExitFullscreen',
      'webkitCancelFullScreen',
      'mozCancelFullScreen',
      'msExitFullscreen',
    ]) {
      if (key in document) {
        return true;
      }
    }
    return false;
  }());

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    container.className = "unity-mobile";
    config.devicePixelRatio = window.devicePixelRatio;
  }

  loadingCover.style.display = "";

  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      spinner.style.display = "none";
      progressBarEmpty.style.display = "";
      progressBarFull.style.width = `${100 * progress}%`;
    }).then((unityInstance) => {
      loadingCover.style.display = "none";

      // Применяем размер 1920×1080
      resizeCanvas();

      // Автоматический фуллскрин
      unityInstance.SetFullscreen(1);

      if (canFullscreen) {
        if (!hideFullScreenButton) {
          fullscreenButton.style.display = "";
        }
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);

  // Слушаем ресайз окна
  window.addEventListener("resize", resizeCanvas);

  // Первичная проверка ориентации и размера
  window.addEventListener('load', () => {
    checkOrientation();
    resizeCanvas();
  });
</script>
</body>
</html>
