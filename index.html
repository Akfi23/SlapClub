<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slap Club</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:#000;
}

#loading-cover {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  background:
    radial-gradient(circle at center,
      rgba(30,80,180,0.25) 0%,
      rgba(10,20,50,0.15) 30%,
      rgba(0,0,0,0) 70%),
    #000;
  transition: opacity 0.65s ease-out;
  will-change: opacity;
}

#unity-canvas {
  position:absolute;
  background:#000;
  opacity: 0;
  transition: opacity 0.5s ease-in;
  will-change: opacity;
}

.loader {
  position:relative;
  width:420px;
  height:420px;
}

.logo {
  position:absolute;
  width:180px;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%) scale(1);
  will-change: transform;
}

.circle {
  position:absolute;
  width:18px;
  height:18px;
  background:#4fc3ff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>

<div id="loading-cover">
  <div class="loader" id="loader">
    <img src="logo.png" class="logo" id="logo">
  </div>
</div>

<script>
// ===== CONFIG =====
const ASPECT = 1920 / 1080;
let unityReady = false;
let animationPhase = "out";        // "out" → "hover" → "in" → "bounce"
let t = 0;
let floatStrength = 0.0;

const logoSize = 180;              // размер логотипа

// ===== ELEMENTS =====
const cover = document.getElementById("loading-cover");
const canvas = document.getElementById("unity-canvas");
const logo = document.getElementById("logo");
const loader = document.getElementById("loader");

// ===== RESIZE =====
function resizeCanvas() {
  const w = innerWidth, h = innerHeight;
  let dw, dh;
  if (w / h > ASPECT) { dh = h; dw = h * ASPECT; }
  else { dw = w; dh = w / ASPECT; }

  canvas.style.width = dw + "px";
  canvas.style.height = dh + "px";
  canvas.style.left = "50%";
  canvas.style.top = "50%";
  canvas.style.transform = "translate(-50%, -50%)";
}

// ===== CIRCLES =====
const COUNT = 9;
const MIN_R = 95, MAX_R = 170;
let circles = [];

for (let i = 0; i < COUNT; i++) {
  let el = document.createElement("div");
  el.className = "circle";
  loader.appendChild(el);
  circles.push({
    el: el,
    targetX: 0,
    targetY: 0,
    currentX: 0,
    currentY: 0,
    offset: Math.random() * Math.PI * 2
  });
}

function regenTargets() {
  for (let c of circles) {
    let a = Math.random() * Math.PI * 2;
    let r = MIN_R + Math.random() * (MAX_R - MIN_R);
    c.targetX = Math.cos(a) * r;
    c.targetY = Math.sin(a) * r;
    c.currentX = 0;           // начинаем из центра
    c.currentY = 0;
  }
}

// ===== EASING =====
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;

// ===== LOOP =====
let last = performance.now();

function loop(now) {
  let dt = (now - last) * 0.001;
  last = now;
  t += dt;

  const time = now * 0.002;

  // === ЛОГИКА ФАЗ ===
  if (unityReady && animationPhase === "hover") {
    animationPhase = "in";
    t = 0;
  }

  if (animationPhase === "out" && t > 1.1) {
    animationPhase = "hover";
    t = 0;
  }
  if (animationPhase === "in" && t > 1.1) {
    animationPhase = "bounce";
    t = 0;
  }
  if (animationPhase === "bounce" && t > 0.65) {
    cover.style.opacity = "0";
    setTimeout(() => {
      cover.style.display = "none";
      canvas.style.opacity = "1";
    }, 650);
  }

  // Плавная сила парения
  let targetFloat = (animationPhase === "hover") ? 1.15 : 0.4;
  floatStrength += (targetFloat - floatStrength) * (12 * dt);

  for (let c of circles) {
    let baseX = 0, baseY = 0, alpha = 1;

    if (animationPhase === "out") {
      const k = easeOut(Math.min(t * 1.1, 1));
      baseX = c.targetX * k;
      baseY = c.targetY * k;
      alpha = k;
    } 
    else if (animationPhase === "hover") {
      baseX = c.targetX;
      baseY = c.targetY;
      alpha = 1;
    } 
    else if (animationPhase === "in") {
      const k = 1 - easeIn(Math.min(t * 1.1, 1));
      baseX = c.targetX * k;
      baseY = c.targetY * k;
      alpha = k * (1 - Math.min(t * 1.8, 1));   // дополнительный fade out
    } 
    else if (animationPhase === "bounce") {
      baseX = 0;
      baseY = 0;
      alpha = 0;
    }

    // Парение
    const fx = Math.sin(time + c.offset) * 5.3;
    const fy = Math.cos(time + c.offset) * 5.3;

    const x = baseX + fx * floatStrength;
    const y = baseY + fy * floatStrength;

    c.el.style.transform = `translate(-50%, -50%) translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
    c.el.style.opacity = alpha;
  }

  // === МЯГКИЙ БАУНС ЛОГО ===
  if (animationPhase === "bounce") {
    let s = 1;
    if (t < 0.24) {
      s = 1 + (t / 0.24) * 0.48;
    } else if (t < 0.52) {
      s = 1.48 - ((t - 0.24) / 0.28) * 0.55;
    } else {
      s = 0.93 + ((t - 0.52) / 0.13) * 0.07;
    }
    logo.style.transform = `translate(-50%, -50%) scale(${s.toFixed(3)})`;
  } else {
    logo.style.transform = `translate(-50%, -50%) scale(1)`;
  }

  requestAnimationFrame(loop);
}

// ===== UNITY
