<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- Запрет кэширования -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Unity Web Player | Slap Club</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #231F20;
      overflow: hidden;
      width: 100vw;
      height: 108vh; /* 108vh предотвращает "подпрыгивание" под адресной строкой на мобилках */
    }

    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-canvas {
      background: #231F20;
      display: block;
      /* Размеры устанавливаются динамически через JS */
    }
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<!-- Загрузчик Unity (должен быть сгенерирован при Build → Template: "Minimal") -->
<script src="Build/SC.loader.js"></script>

<script>
  // Версия сборки для bust-кэша (можно заменить на хеш коммита или версию)
  const BUILD_VERSION = Date.now();

  // Соотношение сторон игры: 1920x1080 → 16:9
  const GAME_ASPECT = 1920 / 1080; // ≈ 1.777...

  function resizeCanvas() {
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");

    if (!container || !canvas) return;

    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const containerAspect = containerWidth / containerHeight;

    let drawWidth, drawHeight;

    if (containerAspect > GAME_ASPECT) {
      // Широкий контейнер → масштаб по высоте, pillarboxing (по бокам чёрные полосы)
      drawHeight = containerHeight;
      drawWidth = containerHeight * GAME_ASPECT;
    } else {
      // Узкий/портретный контейнер → масштаб по ширине, letterboxing (сверху/снизу полосы)
      drawWidth = containerWidth;
      drawHeight = containerWidth / GAME_ASPECT;
    }

    // Применяем размеры через CSS (не трогаем canvas.width/height — их Unity меняет сам)
    canvas.style.width = `${drawWidth}px`;
    canvas.style.height = `${drawHeight}px`;
  }

  // Запуск Unity
  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: `Build/SC.data?${BUILD_VERSION}`,
    frameworkUrl: `Build/SC.framework.js?${BUILD_VERSION}`,
    codeUrl: `Build/SC.wasm?${BUILD_VERSION}`,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "aaaaa",
    productName: "Slap Club",
    productVersion: "1.0",
    arguments: []
  }).then((unityInstance) => {
    // Сохраняем ссылку, если понадобится позже (например, unityInstance.Quit())
    window.unityInstance = unityInstance;

    // Применяем initial размер
    resizeCanvas();
  }).catch((error) => {
    console.error("Ошибка инициализации Unity:", error);
    alert("Failed to load Unity content. Check console for details.");
  });

  // Обработка resize (включая повороты мобилки)
  window.addEventListener("resize", () => {
    // Дебаунс не обязателен, но может улучшить perf на слабых девайсах
    resizeCanvas();
  });

  // Дополнительно: вызов resize при загрузке страницы (на случай, если loader.js загрузился раньше DOM ready)
  window.addEventListener("load", resizeCanvas);
</script>
</body>
</html>
